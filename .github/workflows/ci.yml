name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore CarbonGuard.sln --locked-mode

      - name: Verify formatting
        run: dotnet format CarbonGuard.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CarbonGuard.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test CarbonGuard.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Build production container
        run: docker build --target final --tag carbonguard-api:ci .
