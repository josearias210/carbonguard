name: Reporte de error
description: Informa un comportamiento reproducible de CarbonGuard.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: No incluyas secretos, datos personales ni registros reales de clientes.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Indica el resultado observado y el esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducción mínima
      description: Incluye datos sintéticos y los comandos necesarios.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión del motor/política
      placeholder: "engine 2.0 / policy 2026-08"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia de verificación

