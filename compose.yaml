name: carbonguard

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: carbonguard-api:local
    init: true
    ports:
      - "${CARBONGUARD_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "true"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

